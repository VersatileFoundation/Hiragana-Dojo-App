name: Build Kiosk Apps

on:
  workflow_dispatch: # Allows manual trigger from GitHub web panel

jobs:
  # -------------------------------------------------------------
  # COMPILE STAGE (WINDOWS & MACOS CO-DEPENDENCY RUNNERS)
  # -------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Compile Windows App Folder
        run: |
          npx electron-packager . "Hiragana Dojo App" --platform=win32 --arch=x64 --electron-version=32.0.0 --app-version=1.0.0 --overwrite --icon=icon.ico --win32metadata.CompanyName="Practice" --win32metadata.FileDescription="Hiragana Dojo Practice Kiosk App" --win32metadata.OriginalFilename="Hiragana Dojo App.exe" --win32metadata.ProductName="Hiragana Dojo App"

      - name: Compile Setup Wizard using Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Asset Cache
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ./installer/hiraganadojoapp-installer.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Compile macOS App (.app)
        run: |
          npx electron-packager . "Hiragana Dojo App" --platform=darwin --arch=universal --electron-version=32.0.0 --app-version=1.0.0 --overwrite --icon=icon.icns

      - name: Package macOS App into Zip
        run: |
          mkdir -p installer
          ditto -c -k --sequesterRsrc --keepParent "./Hiragana Dojo App-darwin-universal/Hiragana Dojo App.app" "./installer/HiraganaDojoApp_Mac.zip"

      - name: Upload macOS Asset Cache
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: ./installer/HiraganaDojoApp_Mac.zip

  # -------------------------------------------------------------
  # RELEASE STAGE (CREATES THE NEW DRAFT AND ATTACHES THE FILES)
  # -------------------------------------------------------------
  create-draft-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the runner permissions to write draft changes to your repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Asset Cache
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts

      - name: Download macOS Asset Cache
        uses: actions/download-artifact@v4
        with:
          name: macos-zip
          path: ./artifacts

      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true # Forces the state to stay hidden until you personally hit publish
          prerelease: false
          tag_name: v1.0.${{ github.run_number }}
          name: "Hiragana Dojo App v1.0.${{ github.run_number }} (Draft)"
          body: |
            ## 🚀 Hiragana Dojo App Deployment
            Automated production build kiosk distribution packages.
            
            ### 🖥️ Native Platform Distribution
            * **Windows Installer:** Run `hiraganadojoapp-installer.exe` to deploy the application and drop a dedicated desktop shortcut utility.
            * **macOS Standalone:** Extract `HiraganaDojoApp_Mac.zip` and move your `.app` file payload straight into your Applications directory.
          files: |
            ./artifacts/hiraganadojoapp-installer.exe
            ./artifacts/HiraganaDojoApp_Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
